<script>
  function togglePopup(id) {
    const popup = document.getElementById(id);
    const otherId = id === "notification-popup" ? "profile-popup" : "notification-popup";
    const otherPopup = document.getElementById(otherId);
    if (otherPopup) otherPopup.classList.add("popup-hidden");
    if (popup) popup.classList.toggle("popup-hidden");
  }

  // Close legacy popups only if those IDs exist.
  window.addEventListener("click", function(e) {
    if (!e.target.closest(".relative")) {
      const notificationPopup = document.getElementById("notification-popup");
      const profilePopup = document.getElementById("profile-popup");
      if (notificationPopup) notificationPopup.classList.add("popup-hidden");
      if (profilePopup) profilePopup.classList.add("popup-hidden");
    }
  });
</script>
<script type="module" src="assets/js/profile.js"></script>

<script type="module" src="services/api.js"></script>

<script type="module">
  import { apiCreateFoodRequest } from "./services/api.js";

  // ── Food Request Submission (FastAPI Connected) ───────────────────────────

  let currentUser = null;

  function showToast(msg, isError = false) {
    let t = document.getElementById('req-toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'req-toast';
      t.style.cssText = 'position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:9999;padding:12px 24px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,0.15);display:none;font-family:Manrope,sans-serif;';
      document.body.appendChild(t);
    }
    t.textContent      = msg;
    t.style.background = isError ? '#ba1a1a' : '#0d631b';
    t.style.color      = '#fff';
    t.style.display    = 'block';
    setTimeout(() => t.style.display = 'none', 3500);
  }

  function initializeRequest() {
    const user = JSON.parse(localStorage.getItem('zervo_current_user') || 'null');
    if (!user) { 
      window.location.href = 'login.html'; 
      return; 
    }
    currentUser = user;
  }

  document.addEventListener('DOMContentLoaded', () => {
    initializeRequest();
    
    const submitBtn = document.getElementById('submit-btn');
    if (!submitBtn) return;

    submitBtn.addEventListener('click', async () => {
      if (!currentUser) { showToast('Please login first', true); return; }
      
      const orgName = document.getElementById('org-name')?.value.trim();
      const address = document.getElementById('address')?.value.trim();
      const contact = document.getElementById('contact')?.value.trim();

      if (!orgName) { showToast('❌ Please enter your organization name', true); return; }
      if (!address) { showToast('❌ Please enter your delivery address', true); return; }
      if (!contact) { showToast('❌ Please enter your contact number', true); return; }

      const btn   = document.getElementById('submit-btn');
      const label = document.getElementById('submit-label');
      btn.disabled      = true;
      label.textContent = 'Sending…';

      const requestData = {
        organisation: orgName,
        address: address,
        contact: contact
      };

      try {
        await apiCreateFoodRequest(requestData);
      } catch (err) {
        console.warn("Backend request submission warning:", err.message);
      }

      // Store in sessionStorage for local fallback
      const requestId = 'req-' + Date.now();
      let requests = JSON.parse(sessionStorage.getItem('zervo_requests') || '{}');
      requests[requestId] = { id: requestId, receiverId: currentUser.uid, ...requestData, status: 'pending', createdAt: Date.now() };
      sessionStorage.setItem('zervo_requests', JSON.stringify(requests));

      showToast('✅ Request sent! Volunteers notified.');
      document.getElementById('org-name').value = '';
      document.getElementById('address').value  = '';
      document.getElementById('contact').value  = '';
      
      btn.disabled = false;
      label.textContent = 'Submit Request';
    });
  });
</script>
