<!DOCTYPE html>

<html class="light" lang="en">

<head>
<meta charset="utf-8" />
<meta content="width=device-width, initial-scale=1.0" name="viewport" />
<title>Login | ZERVO Organic Editorial</title>
<script>
  // Suppress Tailwind Play CDN warning in developer console
  (function() {
    const _warn = console.warn;
    console.warn = function(...args) {
      if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
      _warn.apply(console, args);
    };
  })();
</script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
</style>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#0d631b", "primary-container": "#2e7d32",
          "primary-fixed": "#a3f69c", "primary-fixed-dim": "#88d982",
          "on-primary": "#ffffff", "on-primary-container": "#cbffc2",
          "secondary": "#964900", "secondary-container": "#fc820c",
          "secondary-fixed": "#ffdcc6", "secondary-fixed-dim": "#ffb786",
          "on-secondary": "#ffffff", "on-secondary-container": "#5e2c00",
          "on-secondary-fixed": "#311300", "on-secondary-fixed-variant": "#723600",
          "tertiary": "#386000", "tertiary-container": "#4a7b00",
          "tertiary-fixed": "#b9f474", "tertiary-fixed-dim": "#9ed75b",
          "on-tertiary": "#ffffff", "on-tertiary-container": "#d6ffa5",
          "on-tertiary-fixed": "#0f2000", "on-tertiary-fixed-variant": "#2e4f00",
          "surface": "#f5fced", "surface-dim": "#d5dcce",
          "surface-variant": "#dee5d6", "surface-container": "#e9f0e1",
          "surface-container-low": "#eff6e7", "surface-container-lowest": "#ffffff",
          "surface-container-high": "#e3ebdc", "surface-container-highest": "#dee5d6",
          "on-surface": "#171d14", "on-surface-variant": "#40493d",
          "inverse-surface": "#2c3228", "inverse-on-surface": "#ecf3e4",
          "inverse-primary": "#88d982", "background": "#f5fced",
          "on-background": "#171d14", "outline": "#707a6c",
          "outline-variant": "#bfcaba", "error": "#ba1a1a",
          "error-container": "#ffdad6", "on-error": "#ffffff",
        },
        fontFamily: {
          "headline": ["Plus Jakarta Sans", "sans-serif"],
          "body": ["Manrope", "sans-serif"],
          "label": ["Manrope", "sans-serif"],
        },
        borderRadius: {
          "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"
        },
      },
    },
  }
</script>
</head>

<body class="bg-surface text-on-surface min-h-screen flex flex-col relative overflow-x-hidden">
  <!-- Background Organic Shapes -->
  <div class="fixed inset-0 organic-gradient -z-10"></div>
  <div class="fixed -top-24 -left-24 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
  <div class="fixed -bottom-24 -right-24 w-96 h-96 bg-secondary-container/10 rounded-full blur-3xl"></div>
  <!-- Main Content Canvas -->
  <main class="flex-grow flex items-center justify-center p-6 sm:p-12">
    <div
      class="w-full max-w-md bg-surface-container-lowest rounded-xl p-8 sm:p-10 shadow-[0px_20px_40px_rgba(23,29,20,0.06)] relative overflow-hidden">
      <!-- Brand Anchor -->
      <div class="flex flex-col items-center mb-8">
        <a href="index.html" class="font-headline font-black text-3xl text-primary tracking-tight block">ZERVO</a>
      </div>
      <!-- Error Feedback Section -->
      <div class="mb-6 flex items-center gap-3 p-4 bg-error-container rounded-lg hidden" id="error-message">
        <span class="material-symbols-outlined text-error text-xl" data-icon="error_outline">error_outline</span>
        <p class="text-sm font-medium text-on-error-container">Invalid email or password. Please try again.</p>
      </div>
      <!-- Login Form -->
      <form class="space-y-6">
        <!-- Email Field -->
        <div class="space-y-2">
          <label class="block font-headline font-bold text-sm px-1 text-on-surface">Email Address</label>
          <input
            class="w-full px-5 py-4 bg-surface-container-highest rounded-lg border-none focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/60"
            id="email-input" placeholder="hello@zervo.organic" type="email" />
        </div>
        <!-- Password Field -->
        <div class="space-y-2">
          <div class="flex justify-between items-end px-1">
            <label class="block font-headline font-bold text-sm text-on-surface">Password</label>
            <span class="text-[10px] font-bold text-outline uppercase tracking-wider">Must be at least 8
              characters</span>
          </div>
          <div class="relative group">
            <input
              class="w-full px-5 py-4 bg-surface-container-highest rounded-lg border-none focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/60"
              id="password-input" placeholder="••••••••" type="password" />
            <button
              class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors"
              id="toggle-password"
              type="button">
              <span class="material-symbols-outlined" id="eye-icon" data-icon="visibility">visibility</span>
            </button>
          </div>
          <div class="flex justify-end px-1">
            <a class="text-xs font-bold text-primary hover:underline transition-all" href="forgot-password.html">Forgot Password?</a>
          </div>
        </div>
        <!-- Remember Me & Actions -->
        <!-- Submit Button -->
        <button
          class="w-full py-4 bg-primary text-on-primary font-headline font-bold text-lg rounded-xl shadow-lg hover:shadow-primary/20 active:scale-[0.98] transition-all relative overflow-hidden group"
          id="login-button" type="submit">
          <span class="relative z-10">Login</span>
          <div
            class="absolute inset-0 bg-gradient-to-tr from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity">
          </div>
        </button>
        <!-- Divider -->
        <!-- Social Login -->
      </form>
      <!-- Sign Up Prompt -->
      <div class="mt-8 text-center">
        <p class="text-sm text-on-surface-variant font-medium">
          Don't have an account?
          <a class="text-primary font-bold hover:underline underline-offset-4 ml-1" href="signup.html">Sign up</a>
        </p>
      </div>
    </div>
  </main>
  <script type="module" src="services/api.js"></script>
  <script type="module">
    import { apiLogin } from "./services/api.js";

    // ── DOM Elements ───────────────────────────────────────────────
    const errorMessage  = document.getElementById('error-message');
    const loginButton   = document.getElementById('login-button');
    const emailInput    = document.getElementById('email-input');
    const passwordInput = document.getElementById('password-input');
    const loginForm     = document.querySelector('form');

    const hideError = () => errorMessage.classList.add('hidden');
    const showError = (msg) => {
      errorMessage.querySelector('p').textContent = msg;
      errorMessage.classList.remove('hidden');
    };

    // ── Login Form Submit (FastAPI Backend Connected) ──────────────
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email    = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Please enter both email and password.');
        return;
      }

      if (password.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }

      loginButton.disabled = true;
      loginButton.querySelector('span').textContent = 'Signing in…';

      try {
        // Attempt login via FastAPI Backend
        const res = await apiLogin(email, password);
        if (res && res.access_token) {
          localStorage.setItem('zervo_token', res.access_token);
          localStorage.setItem('zervo_current_user', JSON.stringify(res.user));
          window.location.href = 'role-selection.html';
          return;
        }
      } catch (err) {
        console.warn("Backend unavailable or auth failed, using local session fallback:", err.message);
      }

      // Fallback local session if backend offline or testing
      setTimeout(() => {
        let users = JSON.parse(localStorage.getItem('zervo_registered_users') || '{}');
        let user = users[email.toLowerCase()];

        if (!user) {
          const userName = email.split('@')[0].replace(/[._-]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
          user = {
            uid: 'usr-' + Date.now(),
            name: userName,
            email: email.toLowerCase(),
            role: null
          };
        }

        localStorage.setItem('zervo_current_user', JSON.stringify(user));
        window.location.href = 'role-selection.html';
      }, 300);
    });

    // ── Hide error when user types ──────────────────────────────────
    emailInput.addEventListener('input', hideError);
    passwordInput.addEventListener('input', hideError);

    // ── Toggle password visibility ──────────────────────────────────
    const togglePassword = document.getElementById('toggle-password');
    const eyeIcon        = document.getElementById('eye-icon');
    if (togglePassword && eyeIcon) {
      togglePassword.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  </script>
</body>

</html>
